<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dental Health Adventure — Explore, Learn and Play!</title>
<meta name="description" content="Grade 3 Integrated Studies: Dental Health Adventure. Caring for the teeth, then and now, dental workers and dental tools.">
<style>
/* =====================================================================
   Dental Health Adventure — Grade 3 Integrated Studies (My Body III)
   Standalone file: no external fonts, scripts or images.
   ===================================================================== */
:root{
  --ink:#12304a; --ink2:#2f4f6b; --bg:#eaf7fb; --card:#ffffff; --line:#b9dbe8;
  --teal:#0b8f8a; --teal-d:#066c68; --sky:#1f78c8; --sun:#ffd54a; --sun-d:#7a5b00;
  --coral:#d9484a; --good:#0b7a3b; --good-bg:#e4f7ea; --bad:#a63a00; --bad-bg:#fff0e0;
  --info-bg:#e8f2ff; --radius:18px; --fs:1.1rem; --shadow:0 4px 0 rgba(18,48,74,.14);
}
:root.bigtext{--fs:1.35rem}
*{box-sizing:border-box}
html{font-size:100%}
body{margin:0;font-family:"Trebuchet MS","Segoe UI",Verdana,Arial,sans-serif;font-size:var(--fs);line-height:1.5;color:var(--ink);
  background:linear-gradient(180deg,#d8f1f8 0,#f4fbfd 380px,#eaf7fb 100%);min-height:100vh;padding-bottom:120px}
h1,h2,h3{line-height:1.2;margin:.2em 0 .4em}
h1{font-size:clamp(1.8rem,5vw,2.8rem)} h2{font-size:clamp(1.4rem,3.6vw,2rem)} h3{font-size:1.25rem}
p{margin:.4em 0 .8em}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:4px solid #ff7a00;outline-offset:3px;border-radius:8px}
button, [role="button"]{touch-action:manipulation;-webkit-tap-highlight-color:transparent}

.skip{position:absolute;left:-999px;top:0;background:#fff;padding:10px;z-index:99}
.skip:focus{left:8px;top:8px}

/* ---------- layout ---------- */
header.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:4px solid var(--teal);box-shadow:0 2px 8px rgba(0,0,0,.08)}
.top-in{max-width:1100px;margin:0 auto;padding:8px 12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--teal-d);cursor:pointer;background:none;border:0;padding:4px}
.brand svg{width:40px;height:40px}
.top-spacer{flex:1}
.pill{background:var(--info-bg);border:2px solid var(--line);border-radius:999px;padding:4px 12px;font-weight:700;white-space:nowrap}
.progress{flex:1 1 160px;min-width:140px;max-width:300px}
.progress .bar{height:16px;background:#dfeef5;border:2px solid var(--line);border-radius:999px;overflow:hidden}
.progress .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),#35c2a6);width:0;transition:width .4s}
.progress small{display:block;font-size:.8rem;color:var(--ink2)}
main{max-width:1100px;margin:0 auto;padding:14px 12px}
.card{background:var(--card);border:3px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);margin:0 0 16px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.center{text-align:center}
.muted{color:var(--ink2)}
.small{font-size:.9em}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:8px 18px;border-radius:14px;border:3px solid var(--teal-d);
  background:var(--teal);color:#fff;font-weight:700;cursor:pointer;box-shadow:0 4px 0 var(--teal-d);text-decoration:none}
.btn:hover{filter:brightness(1.08)} .btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--teal-d)}
.btn.alt{background:#fff;color:var(--teal-d)} .btn.sun{background:var(--sun);color:#3d2d00;border-color:#b78f00;box-shadow:0 4px 0 #b78f00}
.btn.blue{background:var(--sky);border-color:#14588f;box-shadow:0 4px 0 #14588f}
.btn.danger{background:#fff;color:var(--coral);border-color:var(--coral);box-shadow:0 4px 0 var(--coral)}
.btn.small{min-height:40px;padding:4px 12px;font-size:.9rem}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.big{font-size:1.4rem;min-height:64px;padding:10px 30px}

/* ---------- welcome ---------- */
.hero{display:grid;grid-template-columns:minmax(0,200px) 1fr;gap:18px;align-items:center;background:linear-gradient(135deg,#fff 0,#e5f8f4 100%)}
.hero svg.mascot{width:100%;height:auto;animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
@media(max-width:600px){.hero{grid-template-columns:1fr}.hero svg.mascot{max-width:150px;margin:auto}}
.stcard{display:flex;flex-direction:column;gap:6px;text-align:left;cursor:pointer;background:#fff;border:3px solid var(--line);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);width:100%}
.stcard:hover{border-color:var(--teal)}
.stcard .ico{font-size:2rem}
.stcard .meter{height:12px;background:#dfeef5;border-radius:99px;overflow:hidden;border:2px solid var(--line)}
.stcard .meter i{display:block;height:100%;background:var(--teal)}
.tag{display:inline-block;border-radius:99px;padding:2px 10px;font-size:.8rem;font-weight:700;border:2px solid currentColor}
.tag.L1{color:#0b6e3a;background:#e4f7ea}.tag.L2{color:#7a4a00;background:#fff3d6}.tag.L3{color:#6a2a9a;background:#f3e8ff}
.tag.done{color:var(--good);background:var(--good-bg)}
.tag.sup{color:#555;background:#f1f1f1;border-style:dashed}
.tag.src{color:#0b4f8a;background:var(--info-bg)}

/* ---------- learning content ---------- */
.passage{font-size:calc(var(--fs) * 1.08);line-height:1.75;background:#fffdf3;border:3px dashed #e5c85a}
.sent{border-radius:6px;padding:1px 0;transition:background .15s}
.sent.now{background:#ffe27a;outline:2px solid #b78f00;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.w.now{background:#ff9f1a;color:#000;border-radius:4px;text-decoration:underline}
.rd-wrap{position:relative}
.rbtn{border:2px solid var(--sky);background:#fff;color:var(--sky);border-radius:99px;min-height:36px;padding:2px 12px;font-weight:700;cursor:pointer;font-size:.85rem}
.rbtn:hover{background:var(--info-bg)}
.note{border-left:8px solid var(--sky);background:var(--info-bg);border-radius:10px;padding:10px 14px;margin:10px 0}
.note.warn{border-color:#d98300;background:#fff3d6}
.note.safe{border-color:var(--coral);background:#fff0f0}
.note.sup{border-color:#888;background:#f4f4f4}
.vocab{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.vocab div{background:#fff;border:2px solid var(--line);border-radius:12px;padding:8px 12px}
.vocab b{color:var(--teal-d)}
ul.tick{list-style:none;padding-left:0}
ul.tick li{padding:6px 0 6px 34px;position:relative}
ul.tick li:before{content:"✔";position:absolute;left:4px;color:var(--good);font-weight:900}
ul.cross li:before{content:"✘";color:var(--coral)}
.photo{border-radius:12px;border:3px solid var(--line);max-width:100%;height:auto;background:#fff}
figure{margin:0;text-align:center}
figcaption{font-size:.9rem;color:var(--ink2)}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.tab{min-height:44px;padding:6px 16px;border-radius:99px;border:3px solid var(--line);background:#fff;font-weight:700;cursor:pointer}
.tab[aria-pressed=true],.tab[aria-selected=true]{background:var(--teal);color:#fff;border-color:var(--teal-d)}

/* ---------- activities ---------- */
.acard{display:flex;flex-direction:column;gap:6px;background:#fff;border:3px solid var(--line);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow)}
.acard h3{margin:0}
.runner{min-height:240px}
.stepbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.stepbar i{width:28px;height:10px;border-radius:99px;background:#d6e7ee}
.stepbar i.on{background:var(--sky)} .stepbar i.ok{background:var(--good)}
.opts{display:grid;gap:10px;margin:10px 0}
.opt{display:flex;align-items:center;gap:10px;text-align:left;min-height:52px;padding:8px 14px;border:3px solid var(--line);border-radius:14px;background:#fff;cursor:pointer;font-weight:600}
.opt:hover:not([disabled]){border-color:var(--sky);background:var(--info-bg)}
.opt[aria-pressed=true]{border-color:var(--sky);background:var(--info-bg)}
.opt.ok{border-color:var(--good);background:var(--good-bg)}
.opt.no{border-color:var(--bad);background:var(--bad-bg);text-decoration:line-through;opacity:.8}
.opt.sel{border-color:#ff7a00;background:#fff4e0}
.opt.placed{border-color:var(--good);background:var(--good-bg)}
.opt img{height:56px;width:auto;border-radius:8px}
.mark{font-weight:900}
.fb{border-radius:14px;padding:12px 16px;margin:12px 0;border:3px solid var(--line);background:var(--info-bg)}
.fb.ok{background:var(--good-bg);border-color:var(--good)} .fb.no{background:var(--bad-bg);border-color:var(--bad)}
.fb b.h{display:block;font-size:1.1em}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:520px){.cols{grid-template-columns:1fr}}
.bucket{border:3px dashed var(--teal);border-radius:16px;padding:10px;min-height:120px;background:#f2fcfa}
.bucket h3{margin-top:0}
.bucket .opt{margin:6px 0}
.slots{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.slot{min-width:72px;min-height:56px;display:flex;align-items:center;justify-content:center;border:3px dashed var(--ink2);border-radius:12px;font-weight:800;font-size:1.2em;background:#fff}
.slot.full{border-style:solid;border-color:var(--good);background:var(--good-bg)}
.fillrow{padding:10px 0;border-bottom:2px dotted var(--line)}
.blank{display:inline-block;min-width:110px;border-bottom:4px solid var(--ink);text-align:center;font-weight:800;color:var(--good)}
input.in,select.in,textarea.in{border:3px solid var(--line);border-radius:12px;padding:8px 10px;background:#fff;min-height:48px;max-width:100%}
input.in.num{width:90px;text-align:center;font-weight:800}
textarea.in{width:100%;min-height:80px}
label.lbl{display:block;font-weight:700;margin:10px 0 4px}
.pict{width:100%;border-collapse:collapse;background:#fff}
.pict th,.pict td{border:3px solid var(--ink);padding:6px 10px;text-align:left}
.pict td.ic img{height:34px;margin-right:6px;vertical-align:middle}
.pict td.ic span.tc{font-size:1.4rem;margin-right:4px}
.tallyimg{height:34px;vertical-align:middle}
.clue{background:#fffbe3;border:3px solid #e5c85a;border-radius:12px;padding:8px 12px;margin:6px 0}
.flip{background:#fff;border:3px solid var(--line);border-radius:16px;padding:12px;text-align:center;cursor:pointer;width:100%}
.flip[aria-expanded=true]{border-color:var(--teal);background:#f2fcfa}
.flip svg{width:96px;height:110px}
.flip .more{text-align:left;margin-top:6px}
.drawwrap{border:3px solid var(--ink2);border-radius:12px;background:#fff;touch-action:none;max-width:100%}
canvas.draw{width:100%;height:240px;display:block;touch-action:none;cursor:crosshair}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:14px;padding:10px 18px;z-index:60;max-width:90vw;box-shadow:0 6px 16px rgba(0,0,0,.3)}
dialog{border:4px solid var(--teal);border-radius:20px;padding:20px;max-width:520px;width:92vw;color:var(--ink)}
dialog::backdrop{background:rgba(18,48,74,.55)}
.badge{display:flex;gap:12px;align-items:center;background:#fff;border:3px solid var(--line);border-radius:16px;padding:10px 14px}
.badge .med{font-size:2.4rem;filter:grayscale(1);opacity:.4}
.badge.got{border-color:var(--sun-d);background:#fff8dc}.badge.got .med{filter:none;opacity:1}
.teacher{background:#fff3d6;border-bottom:4px solid #d98300}
.teacher .top-in{gap:6px}
.tchip{border:2px solid #d98300;background:#fff;border-radius:99px;min-height:40px;padding:2px 12px;font-weight:700;cursor:pointer}
.tonly{display:none!important}
body .tonly,body .teacher{display:none!important}
.hide{display:none!important}
.sparkle{display:inline-block;animation:pop .5s}
@keyframes pop{0%{transform:scale(.4)}100%{transform:scale(1)}}
.scene{max-width:100%;height:auto;border:3px solid var(--line);border-radius:14px;background:#fff}

/* ---------- reader bar ---------- */
#reader{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:4px solid var(--sky);box-shadow:0 -4px 12px rgba(0,0,0,.12)}
#reader .rin{max-width:1100px;margin:0 auto;padding:6px 10px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
#reader .rmsg{flex:1 1 100%;font-size:.85rem;color:var(--ink2)}
#reader select{max-width:190px;min-height:40px;border:2px solid var(--line);border-radius:10px;background:#fff}
#reader.min .rbody{display:none}
#reader label{font-size:.85rem;display:flex;gap:4px;align-items:center}

/* ---------- print ---------- */
#printArea{display:none}
@media print{
  body{background:#fff;color:#000;padding:0;font-size:12pt}
  body>*:not(#printArea){display:none!important}
  #printArea{display:block!important;padding:10px}
  #printArea h1{font-size:20pt} #printArea h2{font-size:15pt;margin-top:14pt;border-bottom:2px solid #000}
  #printArea table{border-collapse:collapse;width:100%} #printArea td,#printArea th{border:1px solid #000;padding:4px 6px;text-align:left}
  #printArea .vocab{display:block} #printArea .vocab div{border:0;border-bottom:1px dotted #555;border-radius:0;padding:3px 0}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.q{font-weight:700;font-size:1.15em;margin:.4em 0}
.opt .mark{min-width:1.2em}
fieldset{border:3px solid var(--line)}
@media(max-width:700px){header.top{position:static}.hero svg.mascot{max-width:120px}.btn.big{font-size:1.15rem;padding:8px 18px}}
</style>

<body>
<a class="skip" href="#app">Skip to main content</a>

<header class="top"><div class="top-in" id="topbar"></div></header>
<main id="app" tabindex="-1"></main>
<div id="toast" class="toast hide" role="status" aria-live="polite"></div>
<div id="reader" class="min" role="region" aria-label="Read Aloud controls"></div>
<dialog id="dlg" aria-labelledby="dlgT"><h2 id="dlgT"></h2><div id="dlgB"></div><div class="row" id="dlgBtns" style="margin-top:14px"></div></dialog>
<div id="printArea" aria-hidden="true"></div>
<noscript><p style="padding:20px">This activity needs JavaScript. Please open it in a modern web browser.</p></noscript>
<script>
"use strict";
/* =====================================================================
   PART 1 — CORE: helpers, state, scoring, badges, Read Aloud
   ===================================================================== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const reduceMotion = () => window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
let uid = 0;
const nid = () => 'r' + (++uid);

/* ---------- Readable text: wraps sentences and words in spans so the Reader can highlight ---------- */
/* Use **double asterisks** for bold. Returns HTML. */
function rt(text) {
  const sents = String(text).replace(/U\.S\./g, 'U§S§').match(/[^.!?]+(?:[.!?]+["”')]*)?\s*/g) || [String(text)];
  return sents.map(s => s.trim()).filter(Boolean).map(s => {
    let bold = false, off = 0, plain = [], html = [];
    s.split(/\s+/).forEach(tok => {
      const starts = tok.startsWith('**'), ends = /\*\*\W*$/.test(tok) && tok.length > 2;
      const clean = tok.replace(/\*\*/g, '');
      let isB = bold;
      if (starts && !ends) { bold = true; isB = true; }
      else if (starts && ends) { isB = true; }
      else if (!starts && ends) { isB = bold; bold = false; }
      html.push(`<span class="w" data-o="${off}">${isB ? '<b>' : ''}${esc(clean.replace(/§/g, '.'))}${isB ? '</b>' : ''}</span>`);
      plain.push(clean); off += clean.length + 1;
    });
    return `<span class="sent" data-t="${esc(plain.join(' ').replace(/§/g, '.'))}">${html.join(' ')}</span>`;
  }).join(' ');
}
/* A readable block with its own Listen button */
function rd(text, cls = '', tag = 'p', raw = false) {
  const id = nid();
  return `<div class="rd-wrap"><${tag} id="${id}" class="rd ${cls}">${raw ? text : rt(text)}</${tag}><button class="rbtn" data-rd="${id}" aria-label="Listen to this text">🔊 Listen</button></div>`;
}
const plainText = t => String(t).replace(/\*\*/g, '');

/* ---------- State ---------- */
const STORE_KEY = 'dha_progress_v1', FLAG_KEY = 'dha_save_flag';
const S = {
  pts: 0, q: {},            // q[key] = points earned for that question (1 or 2). Each question counts once.
  done: {},                 // done[activityId] = true
  final: null,              // last final-challenge result
  badges: {},               // badges earned
  big: false, save: false,
  view: 'home', st: 1, tab: 'learn', act: null, level: 0
};
function storageOK() { try { localStorage.setItem('__t', '1'); localStorage.removeItem('__t'); return true; } catch (e) { return false; } }
function persist() {
  if (!S.save) return;
  try { localStorage.setItem(STORE_KEY, JSON.stringify({ q: S.q, done: S.done, final: S.final, badges: S.badges })); } catch (e) {}
}
function loadSaved() {
  try {
    if (localStorage.getItem(FLAG_KEY) !== '1') return;
    S.save = true;
    const d = JSON.parse(localStorage.getItem(STORE_KEY) || '{}');
    S.q = d.q || {}; S.done = d.done || {}; S.final = d.final || null; S.badges = d.badges || {};
  } catch (e) {}
}
function setSave(on) {
  S.save = on;
  try { if (on) { localStorage.setItem(FLAG_KEY, '1'); persist(); } else { localStorage.removeItem(FLAG_KEY); localStorage.removeItem(STORE_KEY); } } catch (e) {}
}
function resetAll() {
  S.q = {}; S.done = {}; S.final = null; S.badges = {};
  try { localStorage.removeItem(STORE_KEY); } catch (e) {}
}
const totalPts = () => Object.values(S.q).reduce((a, b) => a + b, 0);

/* Points: first-try correct = 2, correct after hints/retries = 1. A question never scores twice. */
function award(key, wrongs) {
  const p = wrongs === 0 ? 2 : 1;
  if (!S.q[key] || S.q[key] < p) S.q[key] = p;
  persist();
}

/* ---------- Badges (clear criteria) ---------- */
const BADGES = [
  { id: 'smile', icon: '😁', name: 'Healthy Smile Hero', how: 'Finish every activity in Station 1: Caring for the Teeth.', test: () => stationDone(1) },
  { id: 'time', icon: '⏳', name: 'Dental Time Traveller', how: 'Finish every activity in Station 2: Then and Now.', test: () => stationDone(2) },
  { id: 'team', icon: '🧑‍⚕️', name: 'Dental Team Expert', how: 'Finish every activity in Station 3: Meet the Dental Team.', test: () => stationDone(3) },
  { id: 'tools', icon: '🔍', name: 'Dental Tools Detective', how: 'Finish every activity in Station 4: Dental Tools Detective.', test: () => stationDone(4) },
  { id: 'champ', icon: '🏆', name: 'Dental Health Champion', how: 'Earn all four station badges AND score at least 80% in the Final Review Challenge.', test: () => [1, 2, 3, 4].every(stationDone) && S.final && S.final.score / S.final.total >= 0.8 }
];
function checkBadges() {
  BADGES.forEach(b => {
    if (!S.badges[b.id] && b.test()) { S.badges[b.id] = true; toast(`${b.icon} New badge: ${b.name}!`); persist(); }
  });
}
let toastT;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.remove('hide');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.add('hide'), 4200);
}

/* ---------- Dialog helper ---------- */
function ask(title, body, buttons) {
  const d = $('#dlg'); $('#dlgT').textContent = title; $('#dlgB').innerHTML = body;
  const bb = $('#dlgBtns'); bb.innerHTML = '';
  buttons.forEach(b => {
    const el = document.createElement('button'); el.className = 'btn ' + (b.cls || ''); el.textContent = b.t;
    el.onclick = () => { d.close(); b.fn && b.fn(); }; bb.appendChild(el);
  });
  if (d.showModal) d.showModal(); else d.setAttribute('open', '');
}

/* =====================================================================
   READ ALOUD — browser speech synthesis, sentence by sentence.
   * Sentence highlighting always works.
   * Word highlighting is used only if the browser actually sends word-boundary events.
   * Pause = stop and remember the sentence (more reliable across browsers); Resume restarts that sentence.
   ===================================================================== */
const Reader = {
  ok: 'speechSynthesis' in window && 'SpeechSynthesisUtterance' in window,
  voices: [], voiceURI: '', slow: false, autoFb: false, open: false,
  queue: [], idx: -1, state: 'idle', tok: 0, boundarySeen: false,
  init() {
    if (!this.ok) return;
    const load = () => {
      const v = speechSynthesis.getVoices() || [];
      this.voices = v.filter(x => /^en/i.test(x.lang)).concat(v.filter(x => !/^en/i.test(x.lang)));
      const sel = $('#rvoice'); if (sel) this.fillVoices(sel);
    };
    load(); if (speechSynthesis.addEventListener) speechSynthesis.addEventListener('voiceschanged', load);
  },
  fillVoices(sel) {
    sel.innerHTML = '<option value="">Default voice</option>' + this.voices.map(v => `<option value="${esc(v.voiceURI)}"${v.voiceURI === this.voiceURI ? ' selected' : ''}>${esc(v.name)} (${esc(v.lang)})</option>`).join('');
  },
  collect(blocks) {
    const q = [];
    blocks.forEach(b => $$('.sent', b).forEach(s => q.push({ el: s, text: s.dataset.t })));
    return q;
  },
  readBlocks(blocks, from = 0) {
    if (!this.ok) return this.msg();
    this.stop(true);
    this.queue = this.collect(blocks.filter(Boolean));
    if (!this.queue.length) return;
    this.start(from);
  },
  readPage() {
    const blocks = $$('#app .rd').filter(b => b.offsetParent !== null);
    if (!blocks.length) { this.setMsg('There is no text to read on this screen.'); return; }
    this.readBlocks(blocks);
  },
  start(i) {
    if (i >= this.queue.length) { this.stop(); return; }
    this.idx = i; this.state = 'playing'; this.boundarySeen = false;
    const tok = ++this.tok, item = this.queue[i];
    speechSynthesis.cancel();
    setTimeout(() => {
      if (tok !== this.tok) return;
      const u = new SpeechSynthesisUtterance(item.text);
      u.rate = this.slow ? 0.65 : 0.9; u.pitch = 1.05;
      const v = this.voices.find(x => x.voiceURI === this.voiceURI); if (v) { u.voice = v; u.lang = v.lang; } else u.lang = 'en-US';
      u.onstart = () => { if (tok === this.tok) this.mark(item); };
      u.onboundary = e => {
        if (tok !== this.tok || (e.name && e.name !== 'word')) return;
        this.boundarySeen = true; this.markWord(item, e.charIndex);
      };
      u.onend = () => { if (tok === this.tok && this.state === 'playing') this.start(i + 1); };
      u.onerror = e => { if (tok === this.tok && e.error !== 'interrupted' && e.error !== 'canceled') { this.state = 'idle'; this.setMsg('Sorry, the voice stopped. The text is still on the screen so you can keep reading.'); this.ui(); } };
      this.mark(item);
      speechSynthesis.speak(u);
      this.ui();
    }, 40);
  },
  mark(item) {
    $$('.sent.now,.w.now').forEach(e => e.classList.remove('now'));
    item.el.classList.add('now');
    if (item.el.scrollIntoView) item.el.scrollIntoView({ block: 'center', behavior: reduceMotion() ? 'auto' : 'smooth' });
  },
  markWord(item, ci) {
    const ws = $$('.w', item.el); let hit = null;
    ws.forEach(w => { if (+w.dataset.o <= ci) hit = w; });
    $$('.w.now').forEach(e => e.classList.remove('now'));
    if (hit) hit.classList.add('now');
  },
  pause() { if (this.state !== 'playing') return; this.state = 'paused'; this.tok++; speechSynthesis.cancel(); this.ui(); },
  resume() { if (this.state === 'paused' && this.queue.length) this.start(Math.max(0, this.idx)); },
  repeat() { if (this.queue.length && this.idx >= 0) this.start(this.idx); else this.readPage(); },
  stop(quiet) {
    this.tok++; this.state = 'idle'; if (this.ok) speechSynthesis.cancel();
    $$('.sent.now,.w.now').forEach(e => e.classList.remove('now'));
    if (!quiet) this.ui();
  },
  msg() { this.setMsg('Read Aloud is not available in this browser. Everything is written on the screen, so you can still read it. Try Chrome, Edge or Safari for voices.'); },
  setMsg(t) { const m = $('#rmsg'); if (m) m.textContent = t; },
  ui() {
    const r = $('#reader'); if (!r) return;
    const playing = this.state === 'playing';
    const pp = $('#rpause'); if (pp) { pp.textContent = playing ? '⏸ Pause' : (this.state === 'paused' ? '▶ Resume' : '⏸ Pause'); pp.disabled = this.state === 'idle'; }
  },
  render() {
    const r = $('#reader');
    r.className = this.open ? '' : 'min';
    r.innerHTML = `<div class="rin">
      <button class="btn small blue" id="rtoggle" aria-expanded="${this.open}">🔊 Read Aloud ${this.open ? '▾' : '▴'}</button>
      <span class="rbody row" style="gap:6px">
        <button class="btn small" id="rplay">▶ Read this page</button>
        <button class="btn small alt" id="rpause" disabled>⏸ Pause</button>
        <button class="btn small alt" id="rstop">⏹ Stop</button>
        <button class="btn small alt" id="rrep">🔁 Repeat sentence</button>
        <label><input type="checkbox" id="rslow" ${this.slow ? 'checked' : ''}> Slower</label>
        <label><input type="checkbox" id="rauto" ${this.autoFb ? 'checked' : ''}> Read feedback to me</label>
        <label class="sr" for="rvoice" style="display:none">Voice</label>
        <select id="rvoice" aria-label="Choose a voice"></select>
      </span>
      <div class="rmsg rbody" id="rmsg">${this.ok ? 'Tap “Listen” beside any text, or “Read this page”. Words light up if your browser supports it; otherwise the whole sentence lights up.' : ''}</div>
    </div>`;
    if (!this.ok) this.msg();
    this.fillVoices($('#rvoice'));
    $('#rtoggle').onclick = () => { this.open = !this.open; this.render(); };
    $('#rplay').onclick = () => this.readPage();
    $('#rpause').onclick = () => (this.state === 'paused' ? this.resume() : this.pause());
    $('#rstop').onclick = () => this.stop();
    $('#rrep').onclick = () => this.repeat();
    $('#rslow').onchange = e => { this.slow = e.target.checked; };
    $('#rauto').onchange = e => { this.autoFb = e.target.checked; };
    $('#rvoice').onchange = e => { this.voiceURI = e.target.value; };
    ['rplay', 'rpause', 'rstop', 'rrep', 'rvoice', 'rslow', 'rauto'].forEach(id => { const el = $('#' + id); if (el && !this.ok) el.disabled = true; });
    this.ui();
  }
};
/* Delegated click for every “Listen” button */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-rd]'); if (!b) return;
  const el = document.getElementById(b.dataset.rd); if (!el) return;
  if (!Reader.open) { Reader.open = true; Reader.render(); }
  Reader.readBlocks([el]);
});

  <path d="M40 90C30 40 80 20 100 35C115 45 125 45 140 35C160 20 210 40 200 90C195 130 175 150 172 190C170 215 160 228 150 228C135 228 128 190 120 170C112 190 105 228 90 228C80 228 70 215 68 190C65 150 45 130 40 90Z" fill="#fff" stroke="#12304a" stroke-width="6" stroke-linejoin="round"/>

/* Tooth diagram. hl = 'crown'|'root'|'enamel'|'dentine'|'pulp'|null. labels = show names. */
const TOOTH = 'M60 120C60 60 100 40 130 55C150 62 170 62 190 55C220 40 260 60 260 120C260 170 235 200 232 250C230 300 220 330 200 330C180 330 175 280 160 230C145 280 140 330 120 330C100 330 90 300 88 250C85 200 60 170 60 120Z';
function toothSVG(hl, labels) {
  const o = '#ff7a00';
  const hlEl = {
    enamel: `<path d="${TOOTH}" fill="none" stroke="${o}" stroke-width="12"/>`,

/* Tally marks drawn as SVG (groups of five, fifth is the slash) */
function tally(n) {
  let x = 4, out = '';
  for (let g = 0; g < Math.floor(n / 5); g++) {
    out += `<path d="M${x} 6v24M${x + 6} 6v24M${x + 12} 6v24M${x + 18} 6v24M${x - 3} 24L${x + 22} 12" stroke="#000" stroke-width="3" stroke-linecap="round"/>`; x += 34;
  }
  for (let i = 0; i < n % 5; i++) { out += `<path d="M${x} 6v24" stroke="#000" stroke-width="3" stroke-linecap="round"/>`; x += 8; }
  return `<svg class="tallyimg" viewBox="0 0 ${x + 6} 36" height="34" width="${x + 6}" role="img" aria-label="${n} tally marks">${out}</svg>`;
}

   ===================================================================== */
const OKH = ['✔ Great job!', '✔ Well done!', '✔ You got it!'], NOH = ['✘ Keep trying!', '✘ Let’s learn this together!', '✘ Not yet — you can try again!'];

const norm = s => String(s).trim().toLowerCase().replace(/[,\s]/g, '');
function fbShow(el, kind, head, msg) {
  el.innerHTML = `<div class="fb ${kind}" role="status"><b class="h">${head}</b>${rd(msg, '', 'div')}</div>`;
  if (Reader.ok && Reader.autoFb) { if (!Reader.open) { Reader.open = true; Reader.render(); } Reader.readBlocks([el.querySelector('.rd')]); }
}
const btn = (id, label, cls = '') => `<button class="btn ${cls}" id="${id}">${label}</button>`;
const TYPES = {};

/* ---------- info: reading or looking step ---------- */
TYPES.info = { units: () => 0, run(box, st, ctx) { box.innerHTML = st.html; ctx.finish(); return { reveal: () => '' }; } };

/* ---------- mcq: multiple choice / true-false / multi-select / typed number ---------- */
TYPES.mcq = {
  units: st => st.items.length,
  run(box, st, ctx) {
    let i = 0, first = 0;
    const prep = st.items.map(it => it.num ? null : shuffleIf(it.opts.map((t, k) => ({ t, ok: Array.isArray(it.a) ? it.a.includes(k) : k === it.a })), !it.fixed));
    function shuffleIf(a, yes) { return yes ? shuffle(a) : a; }
    const api = {
      reveal() { const it = st.items[i]; if (it.num) return `<b>Answer:</b> ${esc(it.a[0])}. ${esc(it.why)}`; return `<b>Answer:</b> ${prep[i].filter(o => o.ok).map(o => esc(o.t)).join('; ')}. ${esc(it.why)}`; }
    };
    function show() {
      const it = st.items[i], opts = prep[i]; let wrongs = 0;
      box.innerHTML = `<div class="small muted">Question ${i + 1} of ${st.items.length}${it.multi ? ' · choose all that apply' : ''}</div>
        ${it.story ? `<div class="note">${rd(it.story, '', 'div')}</div>` : ''}
        ${it.pic ? `<div class="center" style="margin:8px 0;overflow-x:auto">${it.pic}</div>` : ''}
        ${rd(it.q, 'q')}
        ${it.num ? `<div class="row"><label class="lbl" for="numin" style="margin:0">Your answer:</label><input class="in num" id="numin" inputmode="numeric" autocomplete="off" aria-label="Type your answer"> ${btn('chk', 'Check')}</div>`
          : `<div class="opts" id="opts">${opts.map((o, k) => `<button class="opt" data-k="${k}" ${it.multi ? 'aria-pressed="false"' : ''}><span class="mark" aria-hidden="true"></span><span>${esc(o.t)}</span></button>`).join('')}</div>${it.multi ? btn('chk', 'Check my answers') : ''}`}
        <div class="row">${it.hint ? btn('hint', '💡 Hint', 'alt small') : ''}</div>
        <div id="fb" aria-live="polite"></div><div id="nx"></div>`;
      const fb = $('#fb', box), nx = $('#nx', box);
      const done = () => {
        if (!ctx.review) ctx.score(i, wrongs);
        if (wrongs === 0) first++;
        if (i < st.items.length - 1) { nx.innerHTML = btn('nq', 'Next question ▶', 'sun'); $('#nq', box).onclick = () => { i++; show(); window.scrollTo({ top: box.offsetTop - 80 }); }; $('#nq', box).focus(); }
        else {
          if (st.items.length > 1 && !ctx.review) nx.innerHTML = `<div class="note">${rt(`You answered ${first} of ${st.items.length} questions correctly on the first try. Every question you finished counts!`)}</div>`;
          ctx.finish();
        }
      };
      const right = () => fbShow(fb, 'ok', pick(OKH), it.why);
      const wrong = extra => { wrongs++; fbShow(fb, 'no', pick(NOH), (extra || '') + (it.hint ? ' Hint: ' + it.hint : ' Look at the question again.')); };
      if ($('#hint', box)) $('#hint', box).onclick = () => fbShow(fb, '', '💡 Hint', it.hint);
      if (it.num) {
        const inp = $('#numin', box);
        const go = () => {
          if (!inp.value.trim()) { fbShow(fb, '', 'Type a number first', 'Write your answer in the box, then press Check.'); return; }
          if (it.a.map(norm).includes(norm(inp.value))) { inp.disabled = true; $('#chk', box).disabled = true; right(); done(); } else wrong();
        };
        $('#chk', box).onclick = go; inp.onkeydown = e => { if (e.key === 'Enter') go(); };
        return;
      }
      const bs = $$('.opt', box);
      const mark = (b, kind) => { b.classList.add(kind); b.querySelector('.mark').textContent = kind === 'ok' ? '✔ ' : '✘ '; };
      if (!it.multi) {
        bs.forEach(b => b.onclick = () => {
          const o = opts[+b.dataset.k];
          if (o.ok) { mark(b, 'ok'); bs.forEach(x => x.disabled = true); right(); done(); }
          else { mark(b, 'no'); b.disabled = true; wrong(); }
        });
      } else {
        bs.forEach(b => b.onclick = () => { if (b.disabled) return; b.setAttribute('aria-pressed', b.getAttribute('aria-pressed') === 'true' ? 'false' : 'true'); b.classList.toggle('sel'); });
        $('#chk', box).onclick = () => {
          const picked = bs.filter(b => b.getAttribute('aria-pressed') === 'true' && !b.disabled);
          if (!picked.length) { fbShow(fb, '', 'Choose first', 'Tap the answers you think are right, then press Check.'); return; }
          let bad = 0;
          picked.forEach(b => { const o = opts[+b.dataset.k]; b.classList.remove('sel'); if (o.ok) mark(b, 'ok'); else { mark(b, 'no'); bad++; } b.disabled = true; });
          const left = opts.filter((o, k) => o.ok && !bs[k].classList.contains('ok')).length;
          if (!bad && !left) { bs.forEach(x => x.disabled = true); $('#chk', box).disabled = true; right(); done(); }
          else wrong(bad ? `${bad} of your choices ${bad > 1 ? 'are' : 'is'} not right (crossed out). ` : `Good start! There ${left > 1 ? 'are' : 'is'} still ${left} more correct answer${left > 1 ? 's' : ''}. `);
        };
      }
    }
    show(); return api;
  }
};

/* ---------- match: tap one on the left, then its partner on the right ---------- */
TYPES.match = {
  units: () => 1,
  run(box, st, ctx) {
    const n = st.pairs.length; let sel = null, wrongs = 0, matched = 0;
    const right = shuffle(st.pairs.map((p, i) => ({ t: p[1], i })));
    box.innerHTML = `<p class="muted">Tap an item on the left, then tap the one that goes with it on the right.</p>
      <div class="cols"><div><h3>${esc(st.head[0])}</h3><div class="opts" id="L">${st.pairs.map((p, i) => `<button class="opt" data-i="${i}"><span class="mark" aria-hidden="true"></span>${esc(p[0])}</button>`).join('')}</div></div>
      <div><h3>${esc(st.head[1])}</h3><div class="opts" id="R">${right.map(r => `<button class="opt" data-i="${r.i}"><span class="mark" aria-hidden="true"></span>${esc(r.t)}</button>`).join('')}</div></div></div><div id="fb" aria-live="polite"></div>`;
    const fb = $('#fb', box), L = $$('#L .opt', box), R = $$('#R .opt', box);
    L.forEach(b => b.onclick = () => { if (b.disabled) return; L.forEach(x => x.classList.remove('sel')); b.classList.add('sel'); sel = b; });
    R.forEach(b => b.onclick = () => {
      if (b.disabled) return;
      if (!sel) { fbShow(fb, '', 'Start on the left', 'First tap an item on the left side.'); return; }
      if (sel.dataset.i === b.dataset.i) {
        matched++; const tag = `(${matched}) `;
        [sel, b].forEach(x => { x.classList.remove('sel'); x.classList.add('placed'); x.disabled = true; x.querySelector('.mark').textContent = '✔ ' + tag; });
        sel = null; fbShow(fb, 'ok', pick(OKH), 'Those two go together!');
        if (matched === n) { ctx.score(0, wrongs); fbShow(fb, 'ok', pick(OKH) + ' All matched!', st.why || 'You matched every pair.'); ctx.finish(); }
      } else { wrongs++; sel.classList.remove('sel'); sel = null; fbShow(fb, 'no', pick(NOH), 'Those two do not go together. Choose an item on the left and try again.'); }
    });
    return { reveal: () => st.pairs.map(p => `${esc(p[0])} → <b>${esc(p[1])}</b>`).join('<br>') };
  }
};

/* ---------- order: tap numbers in order (ties allowed) ---------- */
TYPES.order = {
  units: () => 1,
  run(box, st, ctx) {
    const items = st.items || st.nums.map(n => ({ label: String(n), v: n }));
    const desc = st.dir === 'desc', seq = [];
    const sorted = items.slice().sort((a, b) => desc ? b.v - a.v : a.v - b.v);
    let wrongs = 0;
    box.innerHTML = `<p class="q">${esc(st.prompt || '')}</p><div class="slots" id="slots" aria-label="Your order">${items.map((_, k) => `<div class="slot" aria-label="Place ${k + 1}">${k + 1}</div>`).join('')}</div>
      <div class="row" id="nums">${items.map((it, k) => `<button class="opt" style="min-width:90px;justify-content:center" data-k="${k}">${esc(it.label)}${it.sub ? ' <small>(' + esc(it.sub) + ')</small>' : ''}</button>`).join('')}</div>
      <div class="row" style="margin-top:10px">${btn('rs', '↺ Start over', 'alt small')}</div><div id="fb" aria-live="polite"></div>`;
    const fb = $('#fb', box), slots = $$('.slot', box);
    const reset = () => { seq.length = 0; slots.forEach((s, k) => { s.textContent = k + 1; s.classList.remove('full'); }); $$('#nums .opt', box).forEach(b => b.disabled = false); fb.innerHTML = ''; };
    $('#rs', box).onclick = reset;
    $$('#nums .opt', box).forEach(b => b.onclick = () => {
      const it = items[+b.dataset.k], pos = seq.length;
      if (it.v === sorted[pos].v) {
        seq.push(it); const s = slots[pos]; s.textContent = it.label; s.classList.add('full'); b.disabled = true; b.classList.add('placed');
        if (seq.length === items.length) { ctx.score(0, wrongs); fbShow(fb, 'ok', pick(OKH), (st.why || '') + ' ' + (desc ? 'Descending' : 'Ascending') + ' order is ' + (desc ? 'from the greatest to the least.' : 'from the least to the greatest.')); ctx.finish(); }
        else fbShow(fb, 'ok', '✔ Yes!', 'Now find the ' + (desc ? 'next greatest' : 'next smallest') + ' number.');
      } else { wrongs++; fbShow(fb, 'no', pick(NOH), desc ? 'Look for the GREATEST number that is left.' : 'Look for the SMALLEST number that is left.'); }
    });
    return { reveal: () => '<b>Correct order:</b> ' + sorted.map(x => esc(x.label)).join(', ') };
  }
};

  units: st => st.items.length,
  run(box, st, ctx) {

    function show() {
      const it = st.items[i]; let shown = 1, wrongs = 0;
      box.innerHTML = `<div class="small muted">Mystery ${i + 1} of ${st.items.length}</div><div id="cl"></div>
        <div class="row">${btn('more', '➕ Another clue', 'sun small')}</div>

      const fb = $('#fb', box);
      const draw = () => { $('#cl', box).innerHTML = it.clues.slice(0, shown).map((c, k) => `<div class="clue">${rd('Clue ' + (k + 1) + ': ' + c, '', 'span')}</div>`).join(''); if (shown >= it.clues.length) $('#more', box).disabled = true; };

/* ---------- brush: Brush, Brush, Stop! ---------- */
TYPES.brush = {
  units: () => 1,
  run(box, st, ctx) {
    const CUES = { Brush: ['🪥', 'Pretend to brush!'], Floss: ['🧵', 'Pretend to floss!'], Rinse: ['🫧', 'Pretend to rinse!'], Dentist: ['🦷', 'Open wide for a check-up!'], STOP: ['✋', 'Freeze!'] };
    const seq = shuffle(['Brush', 'Floss', 'Rinse', 'Dentist', 'STOP', 'Brush', 'Rinse', 'Floss', 'Dentist', 'Brush']);
    let n = 0, wrongs = 0, fast = false, timer = null;
    function drawBtns() { return Object.keys(CUES).map(k => `<button class="btn big ${k === 'STOP' ? 'danger' : 'alt'}" data-c="${k}"><span aria-hidden="true">${CUES[k][0]}</span> ${k === 'STOP' ? 'STOP!' : k}</button>`).join(''); }
    function round(list) {
      n = 0;
      function cue() {
        clearTimeout(timer);
        if (n >= list.length) {
          if (!fast) { ctx.score(0, wrongs); box.innerHTML = `<div class="fb ok center"><b class="h">${pick(OKH)} Round complete!</b>${rt('You followed every call. Now freeze like a statue!')}<div class="row" style="justify-content:center;margin-top:10px">${btn('fastb', '⚡ Optional: play the faster round', 'sun')}</div></div>`; $('#fastb', box).onclick = () => { fast = true; round(shuffle(seq).slice(0, 8)); }; ctx.finish(); }
          else { box.innerHTML = `<div class="fb ok center"><b class="h">${pick(OKH)} Faster round complete!</b>${rt('You are a Brush, Brush, Stop champion.')}</div>`; }
          return;
        }
        const c = list[n];
        box.innerHTML = `<div class="small muted">${fast ? 'Faster round (no points, just for fun)' : 'Round 1'} · call ${n + 1} of ${list.length}</div>
          <div class="center card" style="background:#fffbe3"><div style="font-size:3.5rem" aria-hidden="true">${CUES[c][0]}</div><h2 role="status" aria-live="assertive">“${c === 'STOP' ? 'STOP!' : c + '!'}”</h2><p>${CUES[c][1]} <b>Then tap the matching button.</b></p></div>
          <div class="row" style="justify-content:center">${drawBtns()}</div><div id="fb" aria-live="polite"></div>`;
        $$('[data-c]', box).forEach(b => b.onclick = () => {
          if (b.dataset.c === c) { n++; cue(); } else { if (!fast) wrongs++; fbShow($('#fb', box), 'no', pick(NOH), 'Listen to the call again: “' + c + '”. Tap the button that matches it.'); }
        });
        if (fast) timer = setTimeout(() => { n++; cue(); }, 4500);
      }
      cue();
    }
    box.innerHTML = `<p>${rt('The teacher (or this screen) calls out a care word. Act it out, then tap the matching button! Brush, Floss, Rinse, Dentist, or STOP — freeze!')}</p><div class="note sup">${rt('In class, your teacher can call the words and make the game faster each time.')}</div><div class="row">${btn('go', 'Start the game', 'sun')}</div>`;
    $('#go', box).onclick = () => round(seq);
    return { reveal: () => 'Brush → pretend to brush. Floss → pretend to floss. Rinse → pretend to rinse. Dentist → open mouth for a check-up. STOP → freeze.' };
  }
};

  let body = '';
  if (S.tab === 'learn') {
    body = LEARN[s.id]() + `<div class="tonly"><b>Teacher: where this fits in the lesson plan</b><p>${esc(PLAN[s.id])}</p><b>Class discussion questions</b><ul>${DISCUSS[s.id].map(q => `<li>${rt(q)}</li>`).join('')}</ul></div>
      <div class="center"><button class="btn big sun" data-go="station" data-st="${s.id}" data-tab="acts">Go to the activities ▶</button></div>`;
  } else {
    const list = s.acts.filter(a => !S.level || a.level === S.level);
    body = `<div class="tabs" role="group" aria-label="Choose a level">${[[0, 'All levels'], [1, 'Level 1 · Learn'], [2, 'Level 2 · Practise'], [3, 'Level 3 · Challenge']].map(l => `<button class="tab" data-lv="${l[0]}" aria-pressed="${S.level === l[0]}">${l[1]}</button>`).join('')}</div>
      <p class="muted small">Level 1 uses pictures and guided matching. Level 2 has sorting, fill-in-the-blanks and short scenarios. Level 3 asks you to apply what you know. Start anywhere you feel ready.</p>
      <div class="grid g2">${list.map(a => `<div class="acard"><div class="row"><span class="tag ${LV[a.level][1]}">${LV[a.level][0]}</span>${S.done[a.id] ? '<span class="tag done">✔ Done</span>' : ''}</div><h3>${a.title}</h3><p class="muted" style="margin:0">${a.purpose}</p>
        <div><button class="btn" data-go="act" data-act="${a.id}">${S.done[a.id] ? '↺ Play again' : '▶ Start'}</button></div></div>`).join('')}</div>`;
  }
  app.innerHTML = `<div class="card"><div class="row"><span style="font-size:2.4rem" aria-hidden="true">${s.icon}</span><div><h1 style="margin:0">Station ${s.id}: ${s.title}</h1><span class="muted">${n} of ${t} activities finished · Badge: ${badge.icon} ${badge.name}${S.badges[badge.id] ? ' (earned!)' : ''}</span></div></div>
    <div class="tabs"><button class="tab" data-go="station" data-st="${s.id}" data-tab="learn" aria-pressed="${S.tab === 'learn'}">📖 Learn</button><button class="tab" data-go="station" data-st="${s.id}" data-tab="acts" aria-pressed="${S.tab === 'acts'}">🎮 Activities</button></div></div>${body}`;
  $$('[data-lv]', app).forEach(b => b.onclick = () => { S.level = +b.dataset.lv; render(); });
  if (S.tab === 'learn' && s.id === 1) wireTooth();
}
function wireTooth() {
  $$('.partbtn').forEach(b => b.onclick = () => {
    $$('.partbtn').forEach(x => x.setAttribute('aria-pressed', x === b));
    const p = b.dataset.part, v = VOCAB.find(x => x[0] === p);
    $('#toothbox').innerHTML = toothSVG(p, true);
    $('#partinfo').innerHTML = rd(`**${p[0].toUpperCase() + p.slice(1)}:** ${v[1]}`, '', 'div');
  });
}

/* ---------- Activity runner ---------- */
let R = null;
function vAct(app) {
  const f = findAct(S.act); if (!f) return go('map');
  const { st, act } = f; R = { st, act, si: 0, done: [] };
  app.innerHTML = `<p><button class="btn small alt" data-go="station" data-st="${st.id}" data-tab="acts">◀ Back to Station ${st.id}</button></p>
    <div class="card runner"><div class="row"><span class="tag ${LV[act.level][1]}">${LV[act.level][0]}</span></div><h1>${act.title}</h1><p class="muted">${act.purpose}</p>
    <div class="stepbar" id="sb" aria-hidden="true"></div><div id="stepbox"></div><div class="row" id="nav" style="margin-top:12px"></div></div>`;
  runStep();
}
function runStep() {
  const { act, si } = R, step = act.steps[si], box = $('#stepbox'), nav = $('#nav');
  $('#sb').innerHTML = act.steps.map((_, k) => `<i class="${R.done[k] ? 'ok' : k === si ? 'on' : ''}"></i>`).join('');
  nav.innerHTML = ''; box.innerHTML = '';
  const ctx = {
    actId: act.id, si, review: false,
    score: (key, wrongs) => { award(`${act.id}:${si}:${key}`, wrongs); renderTop(); },
    finish: () => {
      R.done[si] = true; $('#sb').innerHTML = act.steps.map((_, k) => `<i class="${R.done[k] ? 'ok' : k === si ? 'on' : ''}"></i>`).join('');
      const last = si === act.steps.length - 1;
      nav.innerHTML = `<button class="btn sun" id="nextstep">${last ? '✔ Finish activity' : 'Next ▶'}</button>`;
      $('#nextstep').onclick = () => { if (last) completeAct(); else { R.si++; runStep(); window.scrollTo(0, 0); } };
      if (step.t !== 'info') setTimeout(() => $('#nextstep') && $('#nextstep').scrollIntoView({ block: 'nearest' }), 50);
    }
  };
  let inst;
  try { inst = TYPES[step.t].run(box, step, ctx); } catch (err) { box.innerHTML = `<div class="fb no">Sorry, this part could not load. Please go back and try again.</div>`; console.error(err); return; }
  // Teacher answer-reveal controls are not included in the student edition.
}
function completeAct() {
  const { act, st } = R; S.done[act.id] = true; persist(); renderTop();
  const idx = st.acts.findIndex(a => a.id === act.id), nxt = st.acts[idx + 1];
  const wasStationDone = stationDone(st.id);
  $('.runner').innerHTML = `<div class="center"><div style="font-size:3rem" class="sparkle" aria-hidden="true">🎉</div><h1>Activity complete!</h1>
    ${rd('Great job! You finished “' + act.title + '”. You have ' + totalPts() + ' points so far.')}
    ${wasStationDone ? `<div class="fb ok">${rt('You finished every activity in Station ' + st.id + '! Check your badge.')}</div>` : ''}
    <div class="row" style="justify-content:center">${nxt ? `<button class="btn sun" data-go="act" data-act="${nxt.id}">Next activity ▶</button>` : `<button class="btn sun" data-go="${st.id < 4 ? 'station' : 'final'}" data-st="${Math.min(st.id + 1, 4)}" data-tab="learn">${st.id < 4 ? 'Go to Station ' + (st.id + 1) + ' ▶' : 'Try the Final Challenge ▶'}</button>`}
    <button class="btn alt" data-go="act" data-act="${act.id}">↺ Play again</button><button class="btn alt" data-go="station" data-st="${st.id}" data-tab="acts">Back to the station</button></div></div>`;
  window.scrollTo(0, 0);
}

/* ---------- Final Review Challenge ---------- */
let F = null;
const TOPIC = { 1: 'Caring for the Teeth', 2: 'Items Used Then and Now', 3: 'Meet the Dental Team', 4: 'Dental Tools' };
function vFinal(app) {
  if (!F) {
    app.innerHTML = `<div class="card center"><div style="font-size:3rem" aria-hidden="true">🏆</div><h1>Final Review Challenge</h1>
      ${rd('This challenge has 20 questions from all four stations: caring for the teeth, items used then and now, the dental team and dental tools. Take your time. When you answer, you will see if you are right and why. At the end you will see your score and what to practise.')}
      <div class="note">${rt('Scoring: each question you get right is 1 point in your final score. Each question can be answered once. You can review your mistakes afterwards and try the whole challenge again.')}</div>
      <button class="btn big sun" id="fgo">Start the challenge ▶</button></div>`;
    $('#fgo').onclick = () => { F = { order: shuffle(FINAL_Q.map((_, i) => i)), i: 0, correct: 0, by: { 1: { c: 0, t: 0 }, 2: { c: 0, t: 0 }, 3: { c: 0, t: 0 }, 4: { c: 0, t: 0 } }, wrong: [], mode: 'q' }; render(); };
    return;
  }
  if (F.mode === 'res') return finalResult(app);
  if (F.mode === 'review') return finalReview(app);
  const id = F.order[F.i], it = FINAL_Q[id];
  const opts = it.num ? null : (it.fixed ? it.opts.map((t, k) => ({ t, ok: k === it.a })) : shuffle(it.opts.map((t, k) => ({ t, ok: k === it.a }))));
  app.innerHTML = `<div class="card"><div class="small muted">Question ${F.i + 1} of ${FINAL_Q.length} · ${TOPIC[it.topic]}</div>
    <div class="progress" style="max-width:100%"><div class="bar" aria-hidden="true"><i style="width:${Math.round(F.i / FINAL_Q.length * 100)}%"></i></div></div>
    ${it.pic ? `<div class="center" style="margin:8px 0;overflow-x:auto">${it.pic}</div>` : ''}${rd(it.q, 'q')}
    ${it.num ? `<div class="row"><label class="lbl" for="fnum" style="margin:0">Your answer:</label><input class="in num" id="fnum" inputmode="numeric" autocomplete="off"> ${btn('fchk', 'Check')}</div>`
      : `<div class="opts" id="fo">${opts.map((o, k) => `<button class="opt" data-k="${k}"><span class="mark" aria-hidden="true"></span>${esc(o.t)}</button>`).join('')}</div>`}
    <div id="fb" aria-live="polite"></div><div id="nx"></div></div>`;
  const fb = $('#fb'), nx = $('#nx'); let answered = false;
  const T = F.by[it.topic];
  const finish = ok => {
    if (answered) return; answered = true; T.t++;
    if (ok) { F.correct++; T.c++; fbShow(fb, 'ok', pick(OKH), it.why); } else { F.wrong.push(id); fbShow(fb, 'no', 'Let’s learn this together!', it.why); }
    const last = F.i === FINAL_Q.length - 1;
    nx.innerHTML = btn('fnext', last ? 'See my results ▶' : 'Next question ▶', 'sun'); $('#fnext').focus();
    $('#fnext').onclick = () => { if (last) endFinal(); else { F.i++; render(); } };
  };
  if (it.num) {
    const go1 = () => { const v = $('#fnum').value; if (!v.trim()) return; $('#fnum').disabled = true; $('#fchk').disabled = true; finish(it.a.map(norm).includes(norm(v))); };
    $('#fchk').onclick = go1; $('#fnum').onkeydown = e => { if (e.key === 'Enter') go1(); };
  } else {
    $$('.opt', $('#fo')).forEach(b => b.onclick = () => {
      const ok = opts[+b.dataset.k].ok; $$('.opt', $('#fo')).forEach((x, k) => { x.disabled = true; if (opts[k].ok) { x.classList.add('ok'); x.querySelector('.mark').textContent = '✔ '; } });
      if (!ok) { b.classList.add('no'); b.querySelector('.mark').textContent = '✘ '; }
      finish(ok);
    });
  }
}
function endFinal() {
  F.mode = 'res';
  S.final = { score: F.correct, total: FINAL_Q.length, by: F.by, wrong: F.wrong.slice() };
  FINAL_Q.forEach((_, id) => { const k = 'fin:' + id; if (!F.wrong.includes(id)) S.q[k] = 2; });
  persist(); render();
}
function finalResult(app) {
  const f = S.final, pct = Math.round(f.score / f.total * 100);
  const msg = pct >= 90 ? 'Fantastic! You are a dental health star!' : pct >= 70 ? 'Great work! You know a lot about healthy teeth.' : pct >= 50 ? 'Good effort! A little more practice will help you grow stronger.' : 'You tried hard! Let’s learn this together. Visit the stations again and you will improve.';
  const good = [], more = [];
  [1, 2, 3, 4].forEach(k => (f.by[k].c >= 4 ? good : more).push(k));
  app.innerHTML = `<div class="card center"><div style="font-size:3rem" class="sparkle" aria-hidden="true">${pct >= 80 ? '🏆' : '🌟'}</div><h1>Your Final Challenge Results</h1>
    <p style="font-size:2rem;margin:.2em"><b>${f.score} out of ${f.total}</b> correct (${pct}%)</p>${rd(msg)}
    <p>Total points so far: <b>⭐ ${totalPts()}</b> of ${MAX_PTS}</p></div>
    <div class="grid g2"><div class="card"><h2>✔ Topics you showed well</h2>${good.length ? `<ul class="tick">${good.map(k => `<li>${TOPIC[k]} (${f.by[k].c} of ${f.by[k].t})</li>`).join('')}</ul>` : '<p>Keep practising and you will get there!</p>'}</div>
    <div class="card"><h2>📘 Topics to practise more</h2>${more.length ? `<ul>${more.map(k => `<li><b>${TOPIC[k]}</b> (${f.by[k].c} of ${f.by[k].t}) <button class="btn small alt" data-go="station" data-st="${k}" data-tab="learn">Visit Station ${k}</button></li>`).join('')}</ul>` : '<p>Nothing to worry about. Great work in every topic!</p>'}</div></div>
    ${pct >= 80 && [1, 2, 3, 4].every(stationDone) ? '<div class="fb ok"><b class="h">🏆 You are a Dental Health Champion!</b></div>' : pct >= 80 ? '<div class="fb">Finish every activity in all four stations to earn the Dental Health Champion badge.</div>' : '<div class="fb">Score 80% or more (and finish all four stations) to earn the Dental Health Champion badge. You can try again!</div>'}
    <div class="row">${f.wrong.length ? btn('frev', '🔎 Review Mistakes', 'blue') : ''}${btn('fagain', '↺ Try Again', 'sun')}<button class="btn alt" data-go="map">Return to Learning Stations</button><button class="btn alt" data-go="summary">📄 Printable summary</button></div>`;
  if (f.wrong.length) $('#frev').onclick = () => { F.mode = 'review'; render(); };
  $('#fagain').onclick = () => { F = null; render(); };
}
function finalReview(app) {
  const items = S.final.wrong.map(id => FINAL_Q[id]);
  app.innerHTML = `<p><button class="btn small alt" id="fback">◀ Back to results</button></p><div class="card"><h1>Review Mistakes</h1><p class="muted">Try these again. This practice does not change your score, so take your time.</p><div id="stepbox"></div></div>`;
  $('#fback').onclick = () => { F.mode = 'res'; render(); };
  TYPES.mcq.run($('#stepbox'), { items: items.map(x => Object.assign({}, x)) }, { review: true, score() {}, finish() { $('#stepbox').insertAdjacentHTML('beforeend', '<div class="fb ok"><b class="h">✔ Great persistence!</b>You have reviewed every question.</div>'); } });
}

/* ---------- Badges, settings ---------- */
function vBadges(app) {
  app.innerHTML = `<h1>🏅 My Badges and Points</h1><p>You have <b>⭐ ${totalPts()} points</b> (out of ${MAX_PTS} possible). Points: 2 for a correct answer on the first try, 1 for a correct answer after another try. Each question counts once.</p>
    <div class="grid g2">${BADGES.map(b => `<div class="badge ${S.badges[b.id] ? 'got' : ''}"><span class="med" aria-hidden="true">${b.icon}</span><div><b>${b.name}</b> ${S.badges[b.id] ? '<span class="tag done">✔ Earned</span>' : '<span class="tag">Not yet</span>'}<br><span class="small">${b.how}</span></div></div>`).join('')}</div>
    <div class="card" style="margin-top:16px"><h2>Settings</h2>
      <label class="row"><input type="checkbox" id="savech" ${S.save ? 'checked' : ''} ${storageOK() ? '' : 'disabled'}> <span>Remember my progress on this device (optional). Nothing is sent anywhere.</span></label>
      <p><button class="btn danger" id="rst">Reset all progress</button></p></div>`;
  $('#savech').onchange = e => { setSave(e.target.checked); toast(e.target.checked ? 'Progress will be saved on this device.' : 'Saved progress was removed.'); };
  $('#rst').onclick = () => ask('Reset all progress?', '<p>This clears points, badges, finished activities and the final score. This cannot be undone.</p>', [{ t: 'Yes, reset', cls: 'danger', fn: () => { resetAll(); toast('Progress was reset.'); render(); } }, { t: 'Cancel', cls: 'alt' }]);
}

/* ---------- Printable summary ---------- */
function summaryHTML() {
  const f = S.final, more = f ? [1, 2, 3, 4].filter(k => f.by[k].c < 4) : [];
  return `<h1>Dental Health Adventure — Learning Summary</h1><p>Grade 3 Integrated Studies · My Body III · Week of October 5–9, 2026</p><p>Name: ______________________ &nbsp; Date: ______________</p>
    <h2>Key facts</h2><ul>${FACTS.map(x => `<li>${esc(x)}</li>`).join('')}</ul>
    <h2>Key vocabulary</h2><div class="vocab">${VOCAB.map(v => `<div><b>${v[0]}:</b> ${esc(v[1])}</div>`).join('')}</div>
    <p class="small">Meanings marked as extra support (crown, enamel, dentine, pulp, root, toothbrush, mouthwash) were added to help students; the lesson plan lists these words without definitions.</p>
    <h2>Station completion</h2><table><tr><th>Station</th><th>Activities finished</th><th>Badge</th></tr>${STATIONS.map(s => { const b = BADGES.find(x => x.id === s.badge); return `<tr><td>${s.id}. ${s.title}</td><td>${stationCount(s.id)} of ${s.acts.length}</td><td>${S.badges[b.id] ? '✔ ' + b.name : 'Not yet'}</td></tr>`; }).join('')}</table>
    <h2>Points and final score</h2><p>Points: ${totalPts()} of ${MAX_PTS}.</p>
    <p>${f ? `Final Review Challenge: <b>${f.score} out of ${f.total}</b> (${Math.round(f.score / f.total * 100)}%).` : 'Final Review Challenge: not taken yet.'}</p>
    <h2>Topics for further practice</h2>${f ? (more.length ? `<ul>${more.map(k => `<li>${TOPIC[k]} (${f.by[k].c} of ${f.by[k].t} correct)</li>`).join('')}</ul>` : '<p>No topics need extra practice. Great work!</p>') : '<p>Take the Final Review Challenge to see which topics need more practice.</p>'}
    ${S.planDone ? `<h2>My Healthy Smile Action Plan</h2><ul><li>Brush in the morning and before bed (twice a day) with fluoride toothpaste.</li><li>Floss regularly.</li><li>Choose water, fruits and vegetables. Limit sweets and sugary drinks.</li><li>Visit the dentist twice a year.</li></ul>` : ''}`;
}
function vSummary(app) {
  app.innerHTML = `<div class="card">${summaryHTML()}<div class="row"><button class="btn sun" id="pr">🖨 Print this summary</button></div><p class="small muted">Printing is optional. Navigation buttons and decorations are left out of the printout.</p></div>`;
  $('#pr').onclick = printSummary;
}
function printSummary() { $('#printArea').innerHTML = summaryHTML(); window.print(); }

/* ---------- start ---------- */
loadSaved(); Reader.init(); Reader.render(); render();
document.addEventListener('keydown', e => { if (e.key === 'Escape' && Reader.state !== 'idle') Reader.stop(); });

</script>
</body>
</html>
