<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Great Dental Adventure! – Grade 3 Integrated Studies</title>
<style>
:root{--ink:#12324a;--blue:#1565c0;--green:#1b7f4b;--orange:#c75b00;--purple:#5e35b1;--pink:#c2185b;--red:#c62828;--yel:#ffe066;--card:#fff;--bg1:#dff4ff;--bg2:#fff6d6}
*{box-sizing:border-box}
html{font-size:20px}
body{margin:0;font-family:"Trebuchet MS","Comic Sans MS",Verdana,sans-serif;color:var(--ink);background:linear-gradient(160deg,var(--bg1),var(--bg2));min-height:100vh;line-height:1.5}
header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:4px solid #29b6f6;padding:8px 12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
header .logo{font-weight:bold;color:var(--blue);margin-right:auto;font-size:1rem}
#prog{width:100%;display:flex;align-items:center;gap:8px;font-size:.8rem}
#bar{flex:1;height:14px;border-radius:9px;background:#d6e9f5;overflow:hidden}
#bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#43a047,#ffd93b);transition:width .5s}
main{max-width:1000px;margin:0 auto;padding:16px}
h1{font-size:2.1rem;margin:.2em 0;color:var(--blue)}h2{font-size:1.4rem;margin:.3em 0}h3{font-size:1.15rem;margin:.4em 0}
.card{background:var(--card);border-radius:22px;padding:16px 20px;margin:14px 0;box-shadow:0 5px 0 #b9dff3,0 8px 18px #0001;border:3px solid #cfe9f7}
button,.btn{touch-action:manipulation;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;font:inherit;font-weight:bold;border:0;border-radius:16px;padding:10px 16px;margin:4px;color:#fff;background:var(--blue);cursor:pointer;box-shadow:0 4px 0 #0003;text-decoration:none;display:inline-block;min-height:46px}
button:hover,.btn:hover{filter:brightness(1.1)}button:active{transform:translateY(3px);box-shadow:none}
button:focus-visible,.btn:focus-visible,.chip:focus-visible{outline:4px solid #ff9800;outline-offset:2px}
button:disabled{opacity:.55;cursor:not-allowed}
.g{background:var(--green)}.o{background:var(--orange)}.p{background:var(--purple)}.k{background:var(--pink)}.r{background:var(--red)}.w{background:#fff;color:var(--ink);border:3px solid #90caf9}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.tcard{border:0;text-align:center;padding:16px;color:#fff;border-radius:22px;font-size:1.05rem}
.tcard .big{font-size:2.6rem;display:block}
.tcard small{display:block;font-weight:normal;font-size:.8rem}
svg.ic{width:64px;height:64px}
.hero{text-align:center}
.hero img{width:120px}
.ra .pass{font-size:1.15rem;line-height:2;margin:.4em 0}
.rawrap{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-start}
.rapic{flex:0 0 230px;max-width:100%}.rapic img{width:100%;border-radius:14px;margin-bottom:6px}
.pass{flex:1 1 300px}
.s{padding:2px 3px;border-radius:8px}

.rw.cur{background:#ffe066;box-shadow:0 0 0 3px #ff9800;color:#000;border-radius:6px}
.rapic.wide{flex:0 0 330px}.tg2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tg2 figure{margin:0;text-align:center;font-size:.75rem;font-weight:bold}.tg2 img{margin:0 0 2px}
.rw:hover{text-decoration:underline dotted;cursor:pointer}
.warn{background:#fff3cd;border:3px solid #ff9800;border-radius:12px;padding:8px}
.note{font-size:.75rem}.st{font-weight:bold;min-height:1.4em}
.ctrl{display:flex;flex-wrap:wrap;align-items:center}
select,input[type=text],textarea{font:inherit;padding:8px;border-radius:12px;border:3px solid #90caf9;max-width:100%}
textarea{width:100%;min-height:80px}
.opts{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.opt{background:#fff;color:var(--ink);border:3px solid #64b5f6;text-align:left;box-shadow:0 4px 0 #90caf9}
.opt.good{background:#d8f5df;border-color:#1b7f4b}.opt.bad{background:#ffe3e0;border-color:#c62828;text-decoration:line-through}
.fb{margin-top:10px;padding:10px 14px;border-radius:14px;font-weight:bold;display:none}
.fb.show{display:block}.fb.good{background:#d8f5df;border:3px solid #1b7f4b}.fb.bad{background:#fff0d6;border:3px solid #c75b00}
.qi{max-width:260px;width:100%;border-radius:14px;display:block;margin:6px auto}
.pair{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}.pair figure{margin:0;text-align:center;flex:1 1 200px;max-width:300px}.pair img,.pair svg{width:100%;max-height:230px;object-fit:contain;border-radius:14px;background:#fff}
.pool,.zones{display:flex;flex-wrap:wrap;gap:10px}
.chip{background:#fff;color:var(--ink);border:3px solid #ffb74d;border-radius:16px;padding:8px;width:150px;text-align:center;font-size:.8rem;cursor:grab;font-weight:bold;box-shadow:0 4px 0 #ffe0b2;font-family:inherit}
.chip img{width:100%;height:80px;object-fit:contain}.chip svg{width:64px;height:64px}.chip .em{font-size:2.4rem;display:block}
.chip.sel{outline:5px solid #ff9800;background:#fff3cd}
.chip.ok{border-color:#1b7f4b;background:#d8f5df;cursor:default;width:100%}
.zone{flex:1 1 220px;min-height:130px;border:4px dashed #64b5f6;border-radius:18px;padding:8px;background:#f2faff;cursor:pointer}
.zone.over{background:#fff3cd;border-color:#ff9800}
.zone h4{margin:0 0 6px;text-align:center;font-size:.95rem}.zone h4 img{height:60px;display:block;margin:0 auto}
.zone .chip{margin:4px 0}
.msg{background:#e3f2fd;border-radius:12px;padding:8px;margin:8px 0;font-weight:bold}
.big{font-size:1.3rem}
.callword{font-size:3.2rem;text-align:center;font-weight:bold;color:var(--pink);margin:6px}
.tbar{height:16px;background:#d6e9f5;border-radius:9px;overflow:hidden;margin:8px 0}.tbar i{display:block;height:100%;background:#ff9800;width:100%}
.gbtns{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}.gbtns button{background:#fff;color:var(--ink);border:3px solid #64b5f6;min-width:120px}
.gbtns button svg{width:44px;height:44px;display:block;margin:0 auto}
.stop{background:var(--red)!important;color:#fff!important;border-color:#7f0000!important}
.picg{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.coll{min-height:90px;background:#e8f8ec;border:4px dashed #43a047;border-radius:18px;padding:8px;display:flex;flex-wrap:wrap;gap:6px}
.coll .chip{width:120px;cursor:default;border-color:#1b7f4b;background:#d8f5df}
.chip.no{opacity:.5;background:#eee}
.pg td,.pg th{padding:6px 10px;border-bottom:2px solid #cfe9f7;text-align:left}.pg .tk{cursor:pointer;font-size:1.5rem;user-select:none}.tk.on{background:#ffe066;border-radius:8px}
.opts2{display:flex;flex-wrap:wrap;gap:8px}.opts2 label{background:#f2faff;border:3px solid #90caf9;border-radius:12px;padding:6px 10px;cursor:pointer}
.slot{min-height:110px;border:4px dashed #90caf9;border-radius:16px;background:#f9fdff;text-align:center;padding:6px;cursor:pointer;flex:1 1 150px;font-size:.8rem}
.slot .em{font-size:2.4rem;display:block}
.inv svg{max-width:100%;height:auto}
.stars{font-size:2.4rem}
.wk{text-align:center}.wk img{width:100%;max-width:250px;border-radius:14px}
.sw{display:inline-block;width:38px;height:38px;border-radius:50%;border:4px solid #fff;box-shadow:0 0 0 2px #888;margin:3px;cursor:pointer;padding:0;min-height:0}
.sw.on{box-shadow:0 0 0 5px #ff9800}
footer{text-align:center;font-size:.75rem;padding:14px}
@keyframes bob{50%{transform:translateY(-8px)}}.bob{animation:bob 2s infinite}
@media(prefers-reduced-motion:reduce){.bob{animation:none}}
@media(max-width:600px){html{font-size:18px}.chip{width:130px}}
@media print{header,footer,.ctrl,button{display:none}}
</style>
</head>

<div id="prog"><span id="ptxt">Progress</span><div id="bar"><i></i></div></div>

<main id="app"></main>

function nav(r){stopSpeech();clearTimeout(gt);hist.push(r);render()}

function seq(){const s=[['topics']];for(const k in TOP){s.push(['topic',k]);TOP[k].acts.forEach(a=>s.push(['act',k,a.id]))}s.push(['final']);return s}
function pageNav(d){stopSpeech();clearTimeout(gt);const s=seq(),r=hist[hist.length-1],i=s.findIndex(x=>x.join()===r.join());if(i<0)return;const j=i+d;if(j<0){goHome();return}if(j>=s.length)return;hist[hist.length-1]=s[j];render()}

/* ---------- Read Along (sentence highlighting; word tap to repeat) ---------- */
function readAlong(sents,pic,title,cls){
const el=document.createElement('div');el.className='card ra';
el.innerHTML=`<h2>📖 ${title} <small>– Read Along</small></h2>${TTS?'':'<div class="warn">🔇 This browser cannot read aloud, so the Read Along buttons are off. You can still read the passage below.</div>'}
<div class="rawrap">${pic?`<div class="rapic ${cls||''}">${pic}</div>`:''}<p class="pass">${sents.map((s,i)=>`<span class="s" data-i="${i}">${s.split(' ').map(w=>`<span class="rw">${w}</span>`).join(' ')}</span>`).join(' ')}</p></div>
<div class="ctrl"><button class="g" data-a="play">▶ Play</button><button class="o" data-a="pause">⏸ Pause</button><button class="p" data-a="resume">⏯ Resume</button><button data-a="replay">🔁 Replay</button><button class="r" data-a="stop">⏹ Stop</button>
<label>Speed <select data-a="rate"><option value=".65">Slow</option><option value=".85" selected>Normal</option><option value="1.05">Fast</option></select></label></div>
<div class="ctrl"><button class="w" data-a="pp">◀ Previous Page</button><button class="w" data-a="np">Next Page ▶</button></div>
<div class="st" aria-live="polite"></div><p class="note">Each word is highlighted in yellow as it is read. On some devices the highlight follows the voice exactly; on others it is a close estimate of the timing. Tap any word to hear it again. Resume starts the current sentence again.</p>`;
let i=0,rate=.85,iv=null;const st=el.querySelector('.st');
const ws=sents.map((s,n)=>[...el.querySelectorAll(`.s[data-i="${n}"] .rw`)]);
const offs=sents.map(s=>{let p=0;return s.split(' ').map(w=>{const o=p;p+=w.length+1;return o})});
const clr=()=>el.querySelectorAll('.rw.cur').forEach(x=>x.classList.remove('cur'));
const hw=(n,k)=>{clr();if(ws[n][k])ws[n][k].classList.add('cur')};
function chain(n,my){i=n;clr();st.textContent=`Reading sentence ${n+1} of ${sents.length}…`;
const u=new SpeechSynthesisUtterance(sents[n]);u.rate=rate;let t0=0;
const times=(()=>{let c=0;return sents[n].split(' ').map(w=>{const s=c;c+=(w.length+1)/(15*rate);return s})})();
const go=()=>{if(t0)return;t0=performance.now();hw(n,0);clearInterval(iv);iv=setInterval(()=>{if(my!==GEN){clearInterval(iv);return}const elapsed=(performance.now()-t0)/1000;let k=0;while(k+1<times.length&&times[k+1]<=elapsed)k++;hw(n,k)},100)};
u.onstart=go;
u.onboundary=e=>{if(my!==GEN)return;if(e.name&&e.name!=='word')return;let k=0;while(k+1<offs[n].length&&offs[n][k+1]<=e.charIndex)k++;hw(n,k);/* Keep the timing fallback running in browsers with incomplete word-boundary events. */t0=performance.now()-(times[k]||0)*1000};
u.onend=()=>{clearInterval(iv);if(my!==GEN)return;if(n+1<sents.length)chain(n+1,my);else{clr();i=0;st.textContent="Finished! 🎉"}};
u.onerror=()=>clearInterval(iv);
speechSynthesis.speak(u);setTimeout(()=>{if(my===GEN)go()},500)}
function start(n){stopSpeech();chain(n,GEN)}
el.addEventListener('click',e=>{const b=e.target.closest('button');
if(b){const a=b.dataset.a;if(a=='pp'){pageNav(-1);return}if(a=='np'){pageNav(1);return}if(!TTS)return;
if(a=='play'||a=='resume')start(i);else if(a=='replay')start(0);else if(a=='pause'){stopSpeech();st.textContent="Paused. Press Resume to continue."}else if(a=='stop'){stopSpeech();clr();i=0;st.textContent="Stopped."}return}
const w=e.target.closest('.rw');if(w&&TTS){stopSpeech();const u=new SpeechSynthesisUtterance(w.textContent.replace(/[^\w'-]/g,''));u.rate=.7;speechSynthesis.speak(u)}});
el.querySelector('[data-a=rate]').addEventListener('change',e=>{rate=+e.target.value});
if(!TTS)el.querySelectorAll('[data-a]').forEach(b=>{if(!['pp','np'].includes(b.dataset.a))b.disabled=true});
return el}

/* ---------- multiple choice engine ---------- */
function mc(box,qs,o){o=o||{};qs=sh(qs).map(q=>({...q,opts:sh(q.o.map((t,i)=>({t,ok:i===q.a})))}));let n=0,first=0;
function show(){const q=qs[n];let tried=false,solved=false;
setSay(strip(q.q)+". "+q.opts.map(x=>x.t).join(". "));
box.innerHTML=`<div class="msg">Question ${n+1} of ${qs.length}</div><div class="card">${o.pre||''}${q.img?`<img class="qi" src="${IMG[q.img]}" alt="${q.alt||''}">`:''}${q.html||''}<h3>${q.q}</h3><button class="w" data-r>🔊 Read question</button><div class="opts"></div><div class="fb" aria-live="polite"></div><div class="nx"></div></div>`;
box.querySelector('[data-r]').onclick=()=>speak(SAY);
const fb=box.querySelector('.fb'),oc=box.querySelector('.opts');
q.opts.forEach(x=>{const b=document.createElement('button');b.className='opt';b.innerHTML=x.t;b.onclick=()=>{if(solved||b.disabled)return;
if(x.ok){solved=true;b.classList.add('good');b.innerHTML="✔ "+x.t;if(!tried)first++;if(o.rec)o.rec(q,!tried);
fb.className='fb good show';fb.innerHTML=`✔ Correct! ${pr()}<br>${q.why||''}`;
const last=n+1>=qs.length;box.querySelector('.nx').innerHTML=`<button class="g">${last?'Finish ✔':'Next question ▶'}</button>`;box.querySelector('.nx button').onclick=()=>{if(last){o.done&&o.done(first,qs.length)}else{n++;show()}}}
else{if(!tried&&o.rec)o.rec(q,false);tried=true;b.disabled=true;b.classList.add('bad');b.innerHTML="✖ "+x.t;fb.className='fb bad show';fb.innerHTML=`✖ Not yet – try again! 💡 Hint: ${q.hint||'Think about what you learned.'}`}};oc.appendChild(b)})}
show()}
function quizDone(box,done,tn){return(f,t)=>{box.innerHTML=`<div class="card hero"><div class="stars">${f>=t*.8?'⭐⭐⭐':f>=t*.5?'⭐⭐':'⭐'}</div><h2>You got ${f} of ${t} right on the first try!</h2><p>${f>=t*.8?"Wonderful work! 🎉":"Good effort! Practise again and you will get even better. 💪"}</p><button class="o" onclick="render()">🔁 Try Again</button> <button class="g" id="fin">✔ Finish</button></div>`;box.querySelector('#fin').onclick=done}}
const mcAct=(qs,pre)=>(box,done)=>mc(box,qs,{pre,done:quizDone(box,done)});

sh(cfg.items).forEach(it=>{const c=document.createElement('button');c.className='chip';c.draggable=true;c.innerHTML=pic(it)+`<span>${it.t}</span>`;
c.onclick=()=>{pool.querySelectorAll('.sel').forEach(x=>x.classList.remove('sel'));sel=it;c.classList.add('sel');c._it=it;fb.className='fb bad show';fb.style.background='#e3f4ff';fb.style.borderColor='#64b5f6';fb.textContent="Now tap the box where this card belongs."};
c.ondragstart=e=>{sel=it;e.dataTransfer.setData('text','x');pool.querySelectorAll('.sel').forEach(x=>x.classList.remove('sel'));c.classList.add('sel')};c._it=it;pool.appendChild(c)});
cfg.buckets.forEach(b=>{const z=document.createElement('div');z.className='zone';z.tabIndex=0;z.setAttribute('role','button');z.innerHTML=`<h4>${b.img?`<img src="${IMG[b.img]}" alt="${b.t}">`:''}${b.t}</h4>`;
const drop=()=>{const c=pool.querySelector('.sel');if(!c||!sel)return;const it=sel;fb.style.background='';fb.style.borderColor='';
if(it.b===b.k){c.classList.remove('sel');c.classList.add('ok');c.draggable=false;c.onclick=null;c.insertAdjacentHTML('beforeend',' ✔');z.appendChild(c);sel=null;left--;fb.className='fb good show';fb.innerHTML=`✔ Yes! ${pr()} ${it.why||''}`;
if(!left){fb.innerHTML+=`<br><button class="g">Finish ✔</button>`;fb.querySelector('button').onclick=done}}
else{miss++;fb.className='fb bad show';fb.innerHTML=`✖ Not that box. Try again! 💡 ${it.hint||'Think about what you learned.'}`}};
z.onclick=drop;z.onkeydown=e=>{if(e.key=='Enter'||e.key==' '){e.preventDefault();drop()}};

function bbs(box,done){let r=0,sc=0,ms=4500,seq=[],call="",wait=false;const W={Brush:['brush','🪥 Pretend to brush your teeth!'],Floss:['floss','🧵 Pretend to floss between your teeth!'],Rinse:['rinse','💦 Pretend to rinse!'],Dentist:['tooth','😮 Open your mouth for a check-up!'],STOP:['stop','🛑 FREEZE! Do not move!']};
box.innerHTML=`<div class="card"><h3>How to play</h3><p>Listen or look for the call word. Tap the matching picture as fast as you can! When you see <b>STOP</b>, tap the red STOP sign.</p><label>Choose speed: <select id="sp"><option value="7500">Easy</option><option value="4500" selected>Medium</option><option value="3200">Fast</option></select></label><br><button class="g" id="go">▶ Play 10 rounds</button></div><div id="gm"></div>`;
const gm=box.querySelector('#gm');
box.querySelector('#go').onclick=()=>{ms=+box.querySelector('#sp').value;r=0;sc=0;seq=sh(["Brush","Floss","Rinse","Dentist","STOP","Brush","Floss","Rinse","Dentist","STOP"]);nextR()};
function nextR(){if(r>=10){setSay("Game over");gm.innerHTML=`<div class="card hero"><div class="stars">${sc>=8?'⭐⭐⭐':sc>=5?'⭐⭐':'⭐'}</div><h2>You scored ${sc} out of 10!</h2><button class="o" onclick="render()">🔁 Play Again</button><button class="g" id="f2">Finish ✔</button></div>`;gm.querySelector('#f2').onclick=done;return}
call=seq[r];wait=false;setSay(call);
gm.innerHTML=`<div class="card"><div class="msg">Round ${r+1} of 10 • Score ${sc}</div><div class="callword" role="status">${call.toUpperCase()}!</div><div class="msg">${W[call][1]}</div><div class="tbar"><i></i></div><div class="gbtns">${Object.keys(W).map(k=>`<button data-k="${k}" class="${k=='STOP'?'stop':''}">${k=='STOP'?stopSvg:W[k][0]=='tooth'?ic.tooth():ic[W[k][0]]()}${k}</button>`).join('')}<button class="w" id="rp">🔊 Hear it again</button></div><div class="fb" aria-live="polite"></div></div>`;
if(TTS)speak(call);const bar=gm.querySelector('.tbar i');bar.style.transition=`width ${ms}ms linear`;requestAnimationFrame(()=>requestAnimationFrame(()=>bar.style.width='0'));
gm.querySelector('#rp').onclick=()=>speak(call);
const end=(ok,m)=>{if(wait)return;wait=true;clearTimeout(gt);if(ok)sc++;const f=gm.querySelector('.fb');f.className='fb show '+(ok?'good':'bad');f.textContent=m;r++;ms=Math.max(2200,ms-250);gt=setTimeout(nextR,1400)};
gm.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>end(b.dataset.k===call,b.dataset.k===call?`✔ Yes! ${call}! ${pr()}`:`✖ Oops! The call was ${call}. Get ready for the next one!`));
gt=setTimeout(()=>end(false,`⏰ Too slow this time! The call was ${call}. You can do it!`),ms)}}

function pictoAct(rows,key,unit,qs){return(box,done)=>{const per=key;box.innerHTML=`<div class="card"><div class="msg">Key: each 🦷 = ${per} ${unit}.<br>👆 Tap the 🦷 pictures to count. Each one you tap adds ${per}!</div><table class="pg"><tbody>${rows.map(r=>`<tr><th>${r[0]}</th><td>${Array(r[1]).fill('<span class="tk" role="button" tabindex="0">🦷</span>').join(' ')}</td></tr>`).join('')}</tbody></table><div class="msg" id="cn">You tapped 0 pictures → 0 × ${per} = 0</div></div><div id="pq"></div>`;

box.querySelectorAll('.tk').forEach(t=>{const f=()=>{t.classList.toggle('on');upd()};t.onclick=f;t.onkeydown=e=>{if(e.key=='Enter'||e.key==' '){e.preventDefault();f()}}});

function clinicAct(box,done){const items=[["Reception desk","🛎️"],["Waiting area","🛋️"],["Dental chair","💺"],["Dental worker","🧑‍⚕️"],["Dental tools","🪞"],["Oral-health poster","🖼️"]];let sel=null,placed=[null,null,null,null,null,null];
box.innerHTML=`<div class="card"><div class="msg">Build your clinic! Tap an item, then tap a space on the floor plan to place it. Tap a placed item to take it back.</div><div class="pool" id="pl"></div><h3>My Clinic Floor Plan</h3><div class="zones" id="fp"></div><div id="ck" class="msg"></div><div id="ex"></div></div>`;
const pl=box.querySelector('#pl'),fp=box.querySelector('#fp');
function draw(){pl.innerHTML="";items.forEach((it,i)=>{if(placed.includes(i))return;const b=document.createElement('button');b.className='chip'+(sel===i?' sel':'');b.innerHTML=`<span class="em">${it[1]}</span>${it[0]}`;b.onclick=()=>{sel=i;draw()};pl.appendChild(b)});
fp.innerHTML="";placed.forEach((p,s)=>{const d=document.createElement('button');d.className='slot';d.style.color='#12324a';d.innerHTML=p===null?`Space ${s+1}<br>(empty)`:`<span class="em">${items[p][1]}</span>${items[p][0]} ✔`;d.onclick=()=>{if(p!==null){placed[s]=null}else if(sel!==null){placed[s]=sel;sel=null}draw()};fp.appendChild(d)});
const c=placed.filter(x=>x!==null).length;box.querySelector('#ck').textContent=`${c} of 6 required parts placed`;
box.querySelector('#ex').innerHTML=c==6?`<h3>Engineering question: How does your clinic help dental workers care for patients?</h3><textarea id="why"></textarea><button class="g" id="fn">✔ Finish my clinic</button><div id="fd"></div>`:"";
if(c==6)box.querySelector('#fn').onclick=()=>{const w=box.querySelector('#why').value.trim();if(w.length<10){box.querySelector('#fd').innerHTML=`<div class="fb bad show">✖ Please explain in a sentence. 💡 For example: "The reception desk is near the door so patients are welcomed."</div>`;return}box.querySelector('#fd').innerHTML=`<div class="fb good show">✔ ${pr()} Your clinic has a reception area, waiting area, dental chair, dental worker, tools and a poster. A good clinic helps the team work together!</div><button class="g" id="f3">Finish ✔</button>`;box.querySelector('#f3').onclick=done}}
draw()}

<div class="card"><h2>Topic review</h2>${Object.keys(f.by).map(k=>{const [a,t]=f.by[k];const need=a<3;return `<p>${need?'💡':'✔'} <b>${names[k]}</b>: ${a} of 3 ${need?`– needs more practice. <button class="o" onclick="nav(['topic','${k}'])">Practise</button>`:'– great job!'}</p>`}).join('')}</div>
