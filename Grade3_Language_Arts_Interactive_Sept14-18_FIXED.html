$('#bPlay').onclick=()=>{if(lv==='sup')return play(readables($('#app')));let els=[...document.querySelectorAll('#learn .tx')];if(!els.length)els=[...document.querySelectorAll('.tx')];play(els)};
$('#bPause').onclick=()=>{if(window.speechSynthesis){speechSynthesis.pause();paused=true}};
$('#bRes').onclick=()=>{if(window.speechSynthesis){speechSynthesis.resume();paused=false}};
$('#bStop').onclick=halt;
$('#bRep').onclick=()=>{if(lastList.length)play(lastList)};
if(window.speechSynthesis)speechSynthesis.onvoiceschanged=()=>{};
ui();home();
</script>
</body>
</html>
